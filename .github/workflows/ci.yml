name: CI

on:
  push:
    branches: [main, feat/24-spectacle-parity]
  pull_request:
    branches: [main, feat/24-spectacle-parity]
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily

jobs:
  build-and-test:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      # dtolnay/rust-toolchain shells its steps with bash, which the
      # self-hosted runner does not have on PATH. Provision Rust with a
      # PowerShell-only step instead. The runner has no MSVC tools (no
      # link.exe), so install the self-contained GNU toolchain, which
      # bundles its own linker — the cdylib's C ABI is identical for the
      # .NET DllImport consumer.
      - name: Ensure Rust toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          $cargo = Join-Path $cargoBin 'cargo.exe'
          if (-not (Test-Path $cargo)) {
            Write-Host 'cargo not found; installing minimal stable toolchain via rustup'
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest -Uri 'https://win.rustup.rs/x86_64' -OutFile $installer -UseBasicParsing
            & $installer -y --default-toolchain stable-x86_64-pc-windows-gnu --profile minimal | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "rustup-init exited with $LASTEXITCODE" }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $cargoBin
          $env:Path = "$cargoBin;$env:Path"
          rustup target add x86_64-pc-windows-gnu
          rustup component add rust-mingw --toolchain stable-x86_64-pc-windows-gnu
          rustc --version --target x86_64-pc-windows-gnu
          cargo --version

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-dll

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # actions/setup-dotnet defaults to C:\Program Files\dotnet on
      # Windows, which the self-hosted runner's account cannot write to.
      # The action honors DOTNET_INSTALL_DIR: point it at a writable
      # persistent location so the SDK is installed once and reused by
      # later runs (RUNNER_TEMP would re-download every job).
      - name: Ensure .NET 8 SDK
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet
        with:
          dotnet-version: '8.0.x'

      # ── Rust: build + test ──────────────────────────────────────────
      - name: Build Rust DLL
        working-directory: rust-dll
        shell: powershell
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Run Rust tests
        working-directory: rust-dll
        shell: powershell
        run: cargo test --target x86_64-pc-windows-gnu

      # ── Copy native DLL for .NET resolution ─────────────────────────
      - name: Copy native DLL
        shell: powershell
        run: |
          New-Item -Path captcho-capture/runtimes/win-x64/native -ItemType Directory -Force
          Copy-Item rust-dll/target/x86_64-pc-windows-gnu/release/captcho_capture.dll captcho-capture/runtimes/win-x64/native/
          # GNU builds link against the MinGW runtime (libgcc/libstdc++/
          # libwinpthread); ship them beside the capture DLL so the .NET
          # host can load it.
          $gccLibs = @('libgcc_s_seh-1.dll','libstdc++-6.dll','libwinpthread-1.dll')
          $rustcSysroot = (& rustc --print sysroot)
          foreach ($lib in $gccLibs) {
            $found = Get-ChildItem -Path $rustcSysroot -Filter $lib -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { Copy-Item $found.FullName captcho-capture/runtimes/win-x64/native/ }
            else { Write-Host "WARN: $lib not found under $rustcSysroot" }
          }

      # ── .NET: build + test ──────────────────────────────────────────
      - name: Restore .NET dependencies
        shell: powershell
        run: dotnet restore captcho.sln

      - name: Build .NET solution
        shell: powershell
        run: dotnet build captcho.sln --configuration Release --no-restore

      - name: Run .NET tests
        shell: powershell
        run: dotnet test captcho.sln --configuration Release --no-build --verbosity normal

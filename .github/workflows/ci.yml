name: CI

on:
  push:
    branches: [main, feat/24-spectacle-parity]
  pull_request:
    branches: [main, feat/24-spectacle-parity]
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily

jobs:
  build-and-test:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      # dtolnay/rust-toolchain shells its steps with bash, which the
      # self-hosted runner does not have on PATH. Provision Rust with a
      # PowerShell-only step instead: reuse the preinstalled rustup/cargo
      # when present, otherwise bootstrap a minimal stable toolchain via
      # rustup-init.exe.
      - name: Ensure Rust toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $cargoBin = Join-Path $env:USERPROFILE '.cargo\bin'
          $cargo = Join-Path $cargoBin 'cargo.exe'
          if (-not (Test-Path $cargo)) {
            Write-Host 'cargo not found; installing minimal stable toolchain via rustup'
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest -Uri 'https://win.rustup.rs/x86_64' -OutFile $installer -UseBasicParsing
            & $installer -y --default-toolchain stable --profile minimal | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "rustup-init exited with $LASTEXITCODE" }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $cargoBin
          $env:Path = "$cargoBin;$env:Path"
          & (Join-Path $cargoBin 'rustc.exe') --version
          & $cargo --version

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-dll

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # actions/setup-dotnet installs into C:\Program Files\dotnet, which
      # the self-hosted runner's account cannot write to. Provision the SDK
      # with a powershell-only step instead: reuse a preinstalled 8.x SDK
      # (PATH or Program Files) or install a user-local one via the official
      # dotnet-install script, then expose it through GITHUB_PATH.
      - name: Ensure .NET 8 SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          function Test-Sdk8([string]$dotnetExe) {
            if (-not (Test-Path $dotnetExe)) { return $false }
            $version = (& $dotnetExe --version) 2>$null
            return ($LASTEXITCODE -eq 0 -and $version -match '^8\.')
          }
          $existing = Get-Command dotnet -ErrorAction SilentlyContinue
          if ($existing -and (Test-Sdk8 $existing.Source)) {
            Write-Host "Using preinstalled SDK: $($existing.Source)"
            $dotnetDir = Split-Path $existing.Source
          }
          else {
            $dotnetDir = Join-Path $env:RUNNER_TEMP 'dotnet'
            $dotnetExe = Join-Path $dotnetDir 'dotnet.exe'
            if (-not (Test-Sdk8 $dotnetExe)) {
              Write-Host "Installing user-local .NET 8 SDK to $dotnetDir"
              New-Item -ItemType Directory -Path $dotnetDir -Force | Out-Null
              $script = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
              Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile $script -UseBasicParsing
              & $script -Channel 8.0 -InstallDir $dotnetDir | Out-Host
              if ($LASTEXITCODE -ne 0) { throw "dotnet-install exited with $LASTEXITCODE" }
            }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $dotnetDir
          $env:Path = "$dotnetDir;$env:Path"
          dotnet --version

      # ── Rust: build + test ──────────────────────────────────────────
      - name: Build Rust DLL
        working-directory: rust-dll
        shell: powershell
        run: cargo build --release

      - name: Run Rust tests
        working-directory: rust-dll
        shell: powershell
        run: cargo test

      # ── Copy native DLL for .NET resolution ─────────────────────────
      - name: Copy native DLL
        shell: powershell
        run: |
          New-Item -Path captcho-capture/runtimes/win-x64/native -ItemType Directory -Force
          Copy-Item rust-dll/target/release/captcho_capture.dll captcho-capture/runtimes/win-x64/native/

      # ── .NET: build + test ──────────────────────────────────────────
      - name: Restore .NET dependencies
        shell: powershell
        run: dotnet restore captcho.sln

      - name: Build .NET solution
        shell: powershell
        run: dotnet build captcho.sln --configuration Release --no-restore

      - name: Run .NET tests
        shell: powershell
        run: dotnet test captcho.sln --configuration Release --no-build --verbosity normal

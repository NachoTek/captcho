name: CI

on:
  push:
    branches: [main, feat/24-spectacle-parity]
  pull_request:
    branches: [main, feat/24-spectacle-parity]
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily

jobs:
  # ── Rust: build + test on a GitHub-hosted runner ─────────────────
  # The self-hosted CI runner has no MSVC toolchain (no link.exe) and no
  # bash, so neither the msvc nor the gnu target can link there. Compile
  # and test the Rust engine on windows-latest, which carries VS Build
  # Tools; produce the native DLL as a workflow artifact for the .NET job.
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-dll

      - name: Build Rust DLL
        working-directory: rust-dll
        run: cargo build --release

      - name: Run Rust tests
        working-directory: rust-dll
        run: cargo test

      - name: Upload native DLL
        uses: actions/upload-artifact@v4
        with:
          name: native-capture-dll
          path: rust-dll/target/release/captcho_capture.dll
          if-no-files-found: error

  # ── .NET: build + test on the self-hosted runner ─────────────────
  dotnet:
    runs-on: [self-hosted, Windows, X64]
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Download native DLL
        uses: actions/download-artifact@v4
        with:
          name: native-capture-dll
          path: captcho-capture/runtimes/win-x64/native

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # actions/setup-dotnet defaults to C:\Program Files\dotnet on
      # Windows, which the self-hosted runner's account cannot write to.
      # The action honors DOTNET_INSTALL_DIR: point it at a writable
      # persistent location so the SDK is installed once and reused by
      # later runs.
      - name: Ensure .NET 8 SDK
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet
        with:
          dotnet-version: '8.0.x'

      # ── .NET: build + test ──────────────────────────────────────────
      - name: Restore .NET dependencies
        shell: powershell
        run: dotnet restore captcho.sln

      - name: Build .NET solution
        shell: powershell
        run: dotnet build captcho.sln --configuration Release --no-restore

      - name: Run .NET tests
        shell: powershell
        run: dotnet test captcho.sln --configuration Release --no-build --verbosity normal

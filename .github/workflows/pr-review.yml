name: PR Review Trigger

# Label-gated agent review (issues #71, #93). When a review label is
# added to a PR — `ready-for-codereview` or `ready-for-specreview` —
# send an HMAC-signed webhook to Hermes with an action that tells
# the receiver which review variant to run. Any other label exits 0
# silently without sending. No webhook fires on CI failure alone.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  trigger-review:
    runs-on: ubuntu-latest
    if: ${{ github.event.label.name == 'ready-for-codereview' || github.event.label.name == 'ready-for-specreview' }}
    steps:
      - name: Send review-request webhook to Hermes
        env:
          WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          # Dispatch label -> (action, route) (issue #93). One send path:
          # same secret, same HMAC, same curl — only the action field and
          # route URL differ between review variants. The gateway routes
          # by URL path, so each variant has its own route.
          LABEL="${{ github.event.label.name }}"
          case "$LABEL" in
            ready-for-codereview)
              ACTION="review_requested"
              WEBHOOK_URL="https://homelab.nachotek.com/hooks/captcho-pr"
              echo "ready-for-codereview label added to PR #$PR_NUMBER"
              ;;
            ready-for-specreview)
              ACTION="spec_review_requested"
              WEBHOOK_URL="https://homelab.nachotek.com/hooks/captcho-pr-specreview"
              echo "ready-for-specreview label added to PR #$PR_NUMBER"
              ;;
            *)
              echo "Label '$LABEL' is not a review trigger; skipping webhook."
              exit 0
              ;;
          esac

          # Build the webhook payload — uses pull_request event type
          # with a custom action so the Hermes agent can distinguish it.
          # Same shape as the previous ci_failed trigger: number,
          # repository.full_name, payload action + check_run stub.
          PAYLOAD=$(cat <<ENDJSON
          {"action":"${ACTION}","number":${PR_NUMBER},"repository":{"full_name":"${REPO}"},"check_run":{"id":${{ github.run_id }},"conclusion":"neutral"}}
          ENDJSON
          )

          # Compute HMAC-SHA256 signature (GitHub-style X-Hub-Signature-256)
          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')

          echo "Sending review-request webhook to Hermes..."
          # --fail-with-body: exit non-zero on HTTP errors (e.g. the
          # empty-signature rejection fork PRs get) instead of failing
          # exit 0 silently.
          RESPONSE=$(curl -s --fail-with-body -o /dev/null -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: pull_request" \
            -H "X-Hub-Signature-256: sha256=${SIGNATURE}" \
            -d "$PAYLOAD")

          echo "Webhook response: HTTP $RESPONSE"

          # The Hermes gateway answers 202 (for processing) on
          # success; 200 is also acceptable. Anything else is a failure.
          case "$RESPONSE" in
            200|202)
              echo "Review agent triggered for PR #$PR_NUMBER"
              ;;
            *)
              echo "Webhook delivery failed (HTTP $RESPONSE)"
              exit 1
              ;;
          esac

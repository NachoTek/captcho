name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-dll

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ── Build Rust DLL ──────────────────────────────────────────────
      - name: Build Rust DLL (release)
        working-directory: rust-dll
        run: cargo build --release

      - name: Run Rust tests
        working-directory: rust-dll
        run: cargo test

      # ── Copy native DLL ─────────────────────────────────────────────
      - name: Copy native DLL
        run: |
          New-Item -Path captcho-capture/runtimes/win-x64/native -ItemType Directory -Force
          Copy-Item rust-dll/target/release/captcho_capture.dll captcho-capture/runtimes/win-x64/native/
        shell: pwsh

      # ── Build .NET ──────────────────────────────────────────────────
      - name: Restore .NET dependencies
        run: dotnet restore captcho.sln

      - name: Build .NET solution (release)
        run: dotnet build captcho.sln --configuration Release --no-restore

      - name: Run .NET tests
        run: dotnet test captcho.sln --configuration Release --no-build --verbosity normal

      # ── Publish ─────────────────────────────────────────────────────
      - name: Publish captcho-ui
        run: |
          dotnet publish captcho-ui/captcho-ui.csproj `
            --configuration Release --runtime win-x64 --self-contained false `
            --output publish/ui

      - name: Publish captcho-cli
        run: |
          dotnet publish captcho-cli/captcho-cli.csproj `
            --configuration Release --runtime win-x64 --self-contained false `
            --output publish/cli

      # ── Package + Release ───────────────────────────────────────────
      - name: Create release archives
        run: |
          Compress-Archive -Path publish/ui/* -DestinationPath captcho-ui-${{ github.ref_name }}.zip
          Compress-Archive -Path publish/cli/* -DestinationPath captcho-cli-${{ github.ref_name }}.zip
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            captcho-ui-${{ github.ref_name }}.zip
            captcho-cli-${{ github.ref_name }}.zip
          generate_release_notes: true
